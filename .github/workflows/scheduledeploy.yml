

name: Deploy to Netlify every 3 days

on:
  schedule:
    # Runs at 00:00 UTC every 3 days
    - cron: '0 0 */3 * *'
  # Allows you to manually trigger the workflow from GitHub's UI if needed
  workflow_dispatch:

jobs:
  trigger-netlify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify Build Hook
        run: |
          curl -X POST -d {} "https://api.netlify.com/build_hooks/6ae4ecff520fb5630c51f8ce"
